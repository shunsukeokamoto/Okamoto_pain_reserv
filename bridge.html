<!DOCTYPE html>
<html lang="ja">
<head><base target="_top"><meta charset="UTF-8"></head>
<body>
<script>
  const ALLOWED_PARENT_ORIGINS = [
    "https://shunsukeokamoto.github.io",
    "http://localhost:8000",
    "http://127.0.0.1:8000"
  ];

  function reply(target, origin, message) {
    target.postMessage(message, origin);
  }

  window.addEventListener("message", function(event) {
    if (!ALLOWED_PARENT_ORIGINS.includes(event.origin)) return;

    const message = event.data || {};
    if (message.source !== "okamoto-reservation-page" || !message.id) return;

    const success = function(result) {
      reply(event.source, event.origin, {
        source: "okamoto-reservation-bridge",
        id: message.id,
        ok: true,
        result: result
      });
    };

    const failure = function(error) {
      reply(event.source, event.origin, {
        source: "okamoto-reservation-bridge",
        id: message.id,
        ok: false,
        error: error && error.message ? error.message : String(error || "処理に失敗しました。")
      });
    };

    if (message.action === "getProducts") {
      google.script.run
        .withSuccessHandler(success)
        .withFailureHandler(failure)
        .getProducts();
      return;
    }

    if (message.action === "submitReservation") {
      google.script.run
        .withSuccessHandler(success)
        .withFailureHandler(failure)
        .submitReservation(message.payload);
      return;
    }

    failure(new Error("未対応の操作です。"));
  });

  parent.postMessage({ source: "okamoto-reservation-bridge", ready: true }, "*");
</script>
</body>
</html>
